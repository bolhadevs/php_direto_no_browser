<div class="container py-4">

  <h3 class="mb-3">Rodando PHP direto no browser com Wasm</h3>

  <!-- DROPZONE -->
  <div id="dropzone" class="dropzone mb-3">
    <strong>Arraste um arquivo .php aqui</strong><br>
    ou clique para selecionar
  </div>

  <!-- FILE INPUT -->
  <input type="file" id="fileInput" accept=".php" hidden>

  <!-- LOADING -->
  <div id="loading" class="d-none text-info mb-2">
    <div class="spinner-border spinner-border-sm"></div>
    Executando...
  </div>

  <!-- EDITOR -->
  <textarea id="editor" class="form-control bg-dark text-light mb-2" rows="8"><?php
echo "Olá #bolhadev";
?></textarea>

  <button id="runBtn" class="btn btn-primary mb-3">
    Executar código
  </button>

  <h5>Output</h5>
  <pre id="output"></pre>

</div>

<script>
function setLoading(v){
  $("#loading").toggleClass("d-none", !v);
}

// limpa execuções antigas
function clearPHP(){
  document.querySelectorAll('script[type="text/php"]').forEach(s => s.remove());
}

// executa PHP WASM
function runPHP(code){
  setLoading(true);

  $("#output").text("");

  clearPHP();

  const script = document.createElement("script");
  script.type = "text/php";
  script.innerHTML = code;

  script.setAttribute("data-stdout", "#output");

  document.body.appendChild(script);

  setTimeout(() => setLoading(false), 600);
}

// botão executar
$("#runBtn").on("click", () => {
  runPHP($("#editor").val());
});

// clique abre file picker
$("#dropzone").on("click", () => {
  $("#fileInput").trigger("click");
});

// input file
$("#fileInput").on("change", function(e){
  const file = e.target.files[0];
  if (!file) return;

  if (!file.name.endsWith(".php")) {
    alert("Envie apenas arquivos .php");
    return;
  }

  const reader = new FileReader();

  reader.onload = (ev) => {
    const content = ev.target.result;
    $("#editor").val(content);   // 🔥 atualiza editor
    runPHP(content);
  };

  reader.readAsText(file);
});

// =========================
// DRAG & DROP FUNCIONANDO
// =========================

$(document).ready(function () {
  // impede o browser de abrir arquivo sozinho
  $(window).on("dragover drop", function (e) {
    e.preventDefault();
  });

  const $dropzone = $("#dropzone");

  $dropzone.on("dragover", function (e) {
    e.preventDefault();
    $dropzone.addClass("dragover");
  });

  $dropzone.on("dragleave", function () {
    $dropzone.removeClass("dragover");
  });

  $dropzone.on("drop", function (e) {
    e.preventDefault();
    $dropzone.removeClass("dragover");

    const file = e.originalEvent.dataTransfer.files?.[0];

    if (!file) return;

    if (!file.name.endsWith(".php")) {
      alert("Apenas arquivos .php são suportados.");
      return;
    }

    const reader = new FileReader();

    reader.onload = function (ev) {
      const content = ev.target.result;

      $("#editor").val(content); // abre no textarea
      runPHP(content);           // executa
    };

    reader.readAsText(file);
  });

});
</script>

</body>
